name: Atlas Runner

on:
  push:
    branches:
      - master

jobs:
  checkout_repo:
    runs-on: [self-hosted, unraid]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for full git history comparison

  copy_env_files:
    runs-on: [self-hosted, unraid]
    needs: checkout_repo
    steps:
      - name: Print Info Before
        run: |
          echo "Hostname: $(hostname)"
          echo "Running as: $(whoami)"
          echo "Current directory: $(pwd)"
          echo "Files:"
          ls -la
          ls -la backend/go-gmail
          ls -la backend/go-pennywise-api
          echo "OS Info:"
          uname -a
      - name: Copy Env Files
        run: |
          cp /mnt/user/LoganShare/Code/secrets/pennywise/.env backend/go-gmail/.env
          cp /mnt/user/LoganShare/Code/secrets/pennywise/pennywise-39654-c87f94721374.json backend/go-gmail/pennywise-39654-c87f94721374.json
          cp /mnt/user/LoganShare/Code/secrets/pennywise/.env backend/go-pennywise-api/.env

      - name: Print Info After
        run: |
          echo "Hostname: $(hostname)"
          echo "Running as: $(whoami)"
          echo "Current directory: $(pwd)"
          echo "Files:"
          ls -la backend/go-gmail
          ls -la backend/go-pennywise-api
          echo "OS Info:"
          uname -a

  # The Go services build from their vendor/ trees (Dockerfiles run
  # `go build -mod=vendor`), but local development goes through the go.work
  # workspace, which reads backend/shared directly and ignores vendor/. A
  # change to backend/shared therefore compiles locally while the vendored
  # copies stay stale and the image build fails. Catch that here instead.
  verify_vendor:
    runs-on: [self-hosted, unraid]
    needs: checkout_repo
    steps:
      # GOWORK=off + -mod=vendor is exactly what the Dockerfiles do, so this
      # fails on the same stale-vendor errors the image build would hit.
      - name: Build services in vendor mode
        run: |
          docker run --rm -v "$PWD":/src:ro -e GOWORK=off \
            golang:1.25-alpine sh -euc '
              cd /src/backend/workflows        && go build -mod=vendor -o /tmp/worker ./cmd/worker
              cd /src/backend/go-gmail         && go build -mod=vendor -o /tmp/gmail  ./cmd
              cd /src/backend/cipher           && go build -mod=vendor -o /tmp/cipher ./cmd/api
              cd /src/backend/go-pennywise-api && go build -mod=vendor -o /tmp/api    ./cmd/api
            '

      # A build can still pass on a vendor tree that merely lags behind
      # backend/shared in files nothing imports yet. Re-vendor a throwaway copy
      # of the tree (the workspace is mounted read-only) and diff it.
      - name: Check vendored dependencies are in sync
        run: |
          docker run --rm -v "$PWD":/src:ro -e GOWORK=off \
            golang:1.25-alpine sh -euc '
              apk add --no-cache git >/dev/null
              git config --global --add safe.directory /src
              mkdir -p /tmp/repo && git -C /src archive HEAD | tar -x -C /tmp/repo
              stale=""
              for service in workflows go-gmail cipher go-pennywise-api; do
                (cd "/tmp/repo/backend/$service" && go mod vendor)
                if ! diff -qr "/tmp/repo/backend/$service/vendor" "/src/backend/$service/vendor"; then
                  stale="$stale $service"
                fi
              done
              if [ -n "$stale" ]; then
                echo "::error::Stale vendor tree(s):$stale — run GOWORK=off go mod vendor in each and commit the result."
                exit 1
              fi
            '

  build_docker:
    runs-on: [self-hosted, unraid]
    needs: [copy_env_files, verify_vendor]
    steps:
      - name: Get changed files
        id: changes
        run: |
          echo "CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | xargs)" >> $GITHUB_OUTPUT

      - name: Determine changed service
        id: filter
        run: |
          declare -A folder_to_service
          folder_to_service["go-gmail"]="gmail-watch"
          folder_to_service["python-mlp"]="python-mlp"
          folder_to_service["go-pennywise-api"]="pennywise-api"
          folder_to_service["src"]="pennywise-app"

          changed_files="${{ steps.changes.outputs.CHANGED }}"
          echo "Changed files: ${changed_files}"
          service_set=()
          for file in $changed_files; do
            if [[ $file =~ ^(backend|frontend|.github)\/([^\/]+)\/ ]]; then
              folder=${BASH_REMATCH[2]}
              service=${folder_to_service[$folder]}
              if [[ -n "$service" ]]; then
                service_set+=("$service")
              fi
            fi
          done
          unique_services=$(printf "%s\n" "${service_set[@]}" | sort -u | tr '\n' ' ')
          echo "Final service list: ${unique_services}"
          echo "SERVICES=$unique_services" >> $GITHUB_OUTPUT

      - name: Build changed service
        run: |
          services="${{ steps.filter.outputs.SERVICES }}"
          echo "Services: ${services}"
          # docker handles only building relevant files
          docker-compose -f ./docker-compose.yml up --build -d

      # - name: Stop existing container
      #   run: docker compose -f ./backend/docker-compose.yml down

      # - name: Build and start containers
      #   run: docker compose -f ./backend/docker-compose.yml up --build -d
