name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/go-gmail/**'
      - 'backend/go-pennywise-api/**'
      - 'backend/cipher/**'
      - 'backend/workflows/**'
      - 'backend/shared/**'
      - '.github/workflows/workflow.yml'
  push:
    branches: [dev]

jobs:
  backend:
    name: Test and build ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [go-gmail, go-pennywise-api, cipher, workflows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/${{ matrix.module }}/go.mod
          cache-dependency-path: |
            backend/${{ matrix.module }}/go.sum
            backend/shared/go.sum
      - name: Vendor dependencies, including the local shared module
        working-directory: backend/${{ matrix.module }}
        run: GOWORK=off go mod vendor
      - name: Test
        working-directory: backend/${{ matrix.module }}
        run: GOWORK=off go test -mod=vendor ./...
      - name: Build
        working-directory: backend/${{ matrix.module }}
        run: GOWORK=off go build -mod=vendor ./...
